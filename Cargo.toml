[package]
name = "logpulse"
version = "0.1.0"
edition = "2021"
authors = ["Akmal Khan <akmalkhaniub>"]
description = "Blazing-fast multi-threaded CLI log and metrics analyzer using zero-copy memory mapping and Rayon."
readme = "README.md"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
colored = "2.1"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
